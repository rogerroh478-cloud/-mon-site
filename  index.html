function loadState() {  
  try {  
    var r = localStorage.getItem(STORAGE_KEY);

      var ids = parsed.operations.map(function(o){return o.id;});

        if (ids.indexOf(op.id) === -1) parsed.operations.push(op);  
      });

      parsed.operations.forEach(function(op) {  
        if (op.id === 'op_init_1' && op.label === 'Virement reçu — Succession') {  
          op.label = 'Virement reçu — Vente de maison';  
        }  
        if (op.id === 'op_init_2' && op.label === 'Virement reçu — Notaire') {  
          op.label = 'Virement reçu — Cession immobilière';  
        }  
      });  
      return parsed;  
    }  
  } catch(e) {}  
  return { solde: SOLDE_INITIAL, operations: OPS_INITIALES.slice() };  
}  
  
var state = loadState();  
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

    return '<div class="op-row">'+

      '<div style="flex:1"><div class="op-name">'+op.label+'</div>'+

        montant:         mFmt,  
        MONTANT:         mFmt,  
        montant_brut:    mt.toFixed(2),  
        motif:           mo||'Virement',  
        MOTIF:           mo||'Virement',  
        ref:             'SGFR'+opId,  
        reference:       'SGFR'+opId,  
        date:            dt.date,  
        heure:           dt.time,  
        date_heure:      dt.date+' à '+dt.time,  
        gestionnaire:    NOM_GESTIONNAIRE,  
        email_gestionnaire: EMAIL_GESTIONNAIRE,  
        statut:          'En attente de traitement',  
        agence:          AGENCE,  
      };  
  
      sgSendEmail('template_9976xw5', params)  
        .then(function(){ console.log('Email confirmation envoyé à', em); })  
        .catch(function(err){ console.error('Erreur email:', err); });  
  
      state.operations.unshift({  
        id:     opId,  
        icon:   'VIREMENT',  
        label:  b,  
        sub:    mo||'Virement',  
        iban:   iv,  
        amt:    -mt,  
        plus:   false,  
        d:      dt.date,  
        statut: 'attente'  
      });  
      state.solde -= mt;  
      saveState();  
  
      virBenef=''; virIban=''; virBic=''; virMontant=''; virMotif=''; virEmail='';  
      virSelectedBenef=-1;  
      virSuccess=true; virSending=false;  
      render();  
    });  
  
    var btnVirReset=document.getElementById('btn-vir-reset');  
    if(btnVirReset) btnVirReset.addEventListener('click',function(){  
      virSuccess=false; currentTab='accueil'; render();  
    });  
  }  
}  
  
render();  
</script>  
</body>
