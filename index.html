<!DOCTYPE html>  
<html lang="fr">  
<head>  
<meta charset="UTF-8"/>  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>  
<title>CIH Bank</title>  
<style>  
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}  
body{background:#f2f4f7;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;max-width:390px;margin:0 auto;min-height:100vh}  
button{font-family:inherit;cursor:pointer}  
input{font-family:inherit;font-size:16px!important}  
:root{--orange:#E05A2B;--blue:#4AABDB;--dark:#1a1a1a;--gray:#6b7280;--white:#ffffff;}  
  
.login-wrap{min-height:100vh;display:flex;flex-direction:column;background:#fff}  
.login-top{background:linear-gradient(160deg,#1a1a2e 0%,#0d1f3c 100%);padding:44px 24px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}  
.login-body{flex:1;padding:32px 24px;display:flex;flex-direction:column}  
.login-title{font-size:24px;font-weight:800;color:var(--dark);margin-bottom:4px}  
.login-sub{font-size:13px;color:var(--gray);margin-bottom:28px}  
.field-wrap{margin-bottom:14px;position:relative}  
.field-label{font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}  
.field-input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:16px;color:var(--dark);background:#fafafa;outline:none;transition:border-color .2s}  
.field-input:focus{border-color:var(--orange)}  
.field-input.err{border-color:#dc2626}  
.eye-btn{position:absolute;right:14px;bottom:14px;background:none;border:none;padding:0;cursor:pointer}  
.err-box{background:#fff8f5;border:1px solid #f5c6a5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#dc2626;font-weight:500}  
.btn-cih{width:100%;background:linear-gradient(135deg,var(--orange),#c04820);color:#fff;border:none;border-radius:12px;padding:16px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;box-shadow:0 4px 15px rgba(224,90,43,0.35)}  
.btn-cih:disabled{opacity:.6}  
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}  
.spin-icon{animation:spin 1s linear infinite}  
  
.splash-card{background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.13);padding:12px 18px 14px;max-width:240px;width:95%;text-align:center;animation:cardBlink 1.2s ease-in-out infinite;}  
@keyframes cardBlink{0%,100%{opacity:1;}50%{opacity:0.15;}}  
.splash-icon-wrap{width:44px;height:44px;border-radius:50%;background:#fff3ee;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}  
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.1;}}  
.blink-icon{animation:blink 1.1s ease-in-out infinite;}  
.splash-title{font-size:13px;font-weight:800;color:#1a1a1a;margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:6px;}  
.splash-msg{font-size:10px;color:#555;line-height:1.4;margin-bottom:10px;}  
.btn-ok{width:100%;background:var(--orange);color:#fff;border:none;border-radius:50px;padding:11px;font-size:15px;font-weight:800;cursor:pointer;}  
  
.app-wrap{display:flex;flex-direction:column;height:100vh;background:#f2f4f7}  
.topbar{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:100}  
.scroll{flex:1;overflow-y:auto;padding-bottom:70px}  
.bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:#fff;border-top:3px solid var(--orange);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}  
.tab-btn{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}  
.tab-lbl{font-size:10px;color:#aaa;font-weight:500}  
.tab-lbl.act{color:var(--orange);font-weight:700}  
.card{background:#fff;border-radius:14px;margin:12px 14px 0;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}  
.bloque-card{background:#fff8f5;border:1.5px solid #f5c6a5;border-radius:10px;margin:12px 14px 0;padding:4px 12px;display:flex;gap:10px;align-items:center}  
.bloque-icon{width:28px;height:28px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.bloque-btn{background:var(--orange);color:#fff;border:none;border-radius:6px;padding:2px 7px;font-size:8px;font-weight:700;white-space:nowrap}  
.solde-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}  
.solde-cell{padding:7px 10px}  
.solde-cell:first-child{border-right:1px solid #f0f0f0}  
.solde-label{font-size:9px;color:var(--gray);margin-bottom:3px}  
.solde-val{font-size:14px;font-weight:900;color:var(--orange);line-height:1}  
.solde-val.black{color:var(--dark)}  
.solde-chf{font-size:9px;font-weight:700;color:var(--gray);margin-left:2px}  
.iban-row{padding:5px 10px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between}  
.iban-lbl{font-size:8px;color:var(--gray);font-weight:600;margin-bottom:1px}  
.iban-val{font-size:9px;color:var(--dark);font-weight:600;display:flex;align-items:center;gap:3px}  
.copy-btn{background:none;border:none;padding:0;cursor:pointer}  
.deblocage-card{background:#fff;border-radius:8px;margin:8px 14px 0;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}  
.deblocage-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}  
.frais-val{font-size:11px;font-weight:900;color:var(--orange)}  
.gest-card{background:#fff;border-radius:14px;margin:10px 14px 0;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}  
.gest-head{font-size:10px;font-weight:700;color:var(--gray);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}  
.gest-body{display:flex;gap:12px;align-items:flex-start}  
.gest-name{font-size:15px;font-weight:800;color:var(--dark);margin-bottom:2px}  
.gest-role{font-size:11px;color:var(--gray);margin-bottom:10px}  
.ops-section{margin:10px 14px 0}  
.op-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}  
.op-row:last-child{border-bottom:none}  
.op-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.op-info{flex:1}  
.op-date{font-size:11px;color:var(--gray);margin-bottom:2px}  
.op-label{font-size:13px;font-weight:600;color:var(--dark)}  
.op-amt{font-size:13px;font-weight:700}  
.op-amt.plus{color:#16a34a}  
.menu-row{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid #f5f5f5;background:#fff;gap:12px}  
.menu-row:last-child{border-bottom:none}  
.menu-icon-wrap{width:34px;height:34px;border-radius:50%;background:#fff8f5;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.invest-wrap{padding:14px;padding-bottom:90px}  
.invest-title{font-size:18px;font-weight:800;color:#1a1a1a;margin-bottom:2px}  
.invest-sub{font-size:12px;color:#b07a5a;margin-bottom:16px}  
.invest-summary{background:linear-gradient(135deg,#E05A2B 0%,#c04820 50%,#4AABDB 100%);border-radius:12px;padding:10px 14px;margin-bottom:10px;color:#fff}  
.invest-summary-label{font-size:8px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}  
.invest-summary-val{font-size:16px;font-weight:900;margin-bottom:2px;letter-spacing:-0.5px}  
.invest-summary-perf{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,.85)}  
.invest-summary-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 7px;font-size:5px;font-weight:700}  
.invest-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)}  
.invest-summary-cell{text-align:center}  
.invest-summary-cell:first-child{border-right:1px solid rgba(255,255,255,.15)}  
.invest-summary-cell-label{font-size:8px;color:rgba(255,255,255,.6);margin-bottom:2px}  
.invest-summary-cell-val{font-size:7px;font-weight:800;color:#90ee90}  
.invest-section-title{font-size:11px;font-weight:700;color:#b07a5a;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}  
.invest-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:10px}  
.invest-asset-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f5f5f5}  
.invest-asset-row:last-child{border-bottom:none}  
.invest-asset-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.invest-asset-info{flex:1;min-width:0}  
.invest-asset-name{font-size:13px;font-weight:800;color:#1a1a1a;margin-bottom:1px}  
.invest-asset-detail{font-size:11px;color:#b07a5a}  
.invest-asset-right{text-align:right;flex-shrink:0}  
.invest-asset-val{font-size:14px;font-weight:800;color:#1a1a1a;margin-bottom:2px}  
.invest-asset-perf{font-size:11px;font-weight:700}  
.invest-asset-perf.pos{color:#16a34a;font-size:7px}  
.invest-asset-perf.neg{color:#dc2626}  
.invest-donut-wrap{padding:18px;display:flex;align-items:center;gap:16px}  
.invest-legend{flex:1;display:flex;flex-direction:column;gap:8px}  
.invest-legend-item{display:flex;align-items:center;gap:8px}  
.invest-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}  
.invest-legend-name{font-size:12px;color:#555;flex:1}  
.invest-legend-pct{font-size:12px;font-weight:800;color:#1a1a1a}  
.invest-bar-row{padding:0 16px 14px}  
.invest-bar-label-row{display:flex;justify-content:space-between;margin-bottom:5px}  
.invest-bar-label{font-size:11px;font-weight:700;color:#555}  
.invest-bar-val{font-size:11px;font-weight:700;color:#1a1a1a}  
.invest-bar-track{height:7px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin-bottom:12px}  
.invest-bar-fill{height:100%;border-radius:4px}  
.invest-perf-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #f5f5f5}  
.invest-perf-row:last-child{border-bottom:none}  
.invest-perf-period{flex:1;font-size:13px;font-weight:600;color:#555}  
.invest-perf-val{font-size:14px;font-weight:800}  
.invest-perf-val.pos{color:#16a34a;font-size:9px}  
.invest-perf-val.neg{color:#dc2626}  
.invest-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700}  
.invest-badge.green{background:#f0fdf4;color:#16a34a}  
.invest-badge.blue{background:#eff8ff;color:#4AABDB}  
.invest-disclaimer{background:#f9fafb;border-radius:12px;padding:12px 14px;margin-top:4px}  
.invest-disclaimer-text{font-size:10px;color:#b07a5a;line-height:1.6}  
  
.card-scene{width:100%;display:block;cursor:pointer;perspective:800px}  
.card-wrap{width:100%;position:relative}  
.card-side{width:100%;aspect-ratio:85.6/54;border-radius:18px;overflow:hidden;position:absolute;top:0;left:0}  
.card-placeholder{width:100%;aspect-ratio:85.6/54;visibility:hidden;display:block}  
</style>  
</head>  
<body>  
<div id="root"></div>  
<script>  
var ORANGE='#E05A2B';  
var BLUE='#4AABDB';  
var BRAND=ORANGE;  
var currentPage='login';  
var currentTab='accueil';  
var loginErr='';  
var loginLoading=false;  
var showCode=false;  
var cardFlipped=false;  
var cardNumberVisible=false;  
  
var TITULAIRE_NOM='Christine Garnier';  
var TITULAIRE_INITIALES='CG';  
var TITULAIRE_EMAIL='Christinegarnier0505@gmail.com';  
var SOLDE_TOTAL=2500000;  
var FRAIS_DEBLOCAGE=22750;  
  
function fmt(v){return Math.abs(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});}  
function getFrDT(){var n=new Date();var d=n.toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',day:'2-digit',month:'2-digit',year:'numeric'});var t=n.toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});return{date:d,time:t};}  
  
/* Vrai logo CIH BANK : CIH [flèche orange/bleue] BANK — viewBox 320x80 */  
function cihLogoSVG(textFill){  
  textFill=textFill||'#1a1a1a';  
  return '<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" style="display:block">'+  
    /* CIH */  
    '<text x="0" y="62" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="68" fill="'+textFill+'" letter-spacing="-1">CIH</text>'+  
    /* Flèche orange (haut) */  
    '<polygon points="178,4 218,40 178,40" fill="#E05A2B"/>'+  
    /* Flèche bleue (bas) */  
    '<polygon points="178,40 218,40 178,76" fill="#4AABDB"/>'+  
    /* BANK */  
    '<text x="228" y="62" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="68" fill="'+textFill+'" letter-spacing="-1">BANK</text>'+  
  '</svg>';  
}  
function cihLogo(size){  
  return '<div style="width:'+(size||220)+'px">'+cihLogoSVG('#1a1a1a')+'</div>';  
}  
function cihLogoWhite(size){  
  return '<div style="width:'+(size||220)+'px">'+cihLogoSVG('#ffffff')+'</div>';  
}  
  
function svgSpinner(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="spin-icon"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.4)" stroke-width="3"/><path d="M12 3a9 9 0 019 9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';}  
function svgEyeOff(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="#aaa" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="#aaa" stroke-width="1.8" stroke-linecap="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="#aaa" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgEyeOn(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#aaa" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="#aaa" stroke-width="1.8"/></svg>';}  
function svgHome(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z" fill="'+(a?ORANGE:'none')+'" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke="'+(a?'#fff':'#aaa')+'" stroke-width="1.8"/></svg>';}  
function svgCard(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8"/><line x1="2" y1="10" x2="22" y2="10" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8"/></svg>';}  
function svgTransfer(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 9h14M5 9l4-4M5 9l4 4" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 15H5M19 15l-4-4M19 15l-4 4" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}  
function svgChart(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><polyline points="3,17 8,12 13,14 21,7" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="20" x2="21" y2="20" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgDots(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.5" fill="'+(a?ORANGE:'#aaa')+'"/><circle cx="12" cy="12" r="1.5" fill="'+(a?ORANGE:'#aaa')+'"/><circle cx="19" cy="12" r="1.5" fill="'+(a?ORANGE:'#aaa')+'"/></svg>';}  
function svgHistory(a){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8"/><polyline points="12,7 12,12 15,15" stroke="'+(a?ORANGE:'#aaa')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}  
function svgMenu(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="18" x2="21" y2="18" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgBell(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgLogout(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><polyline points="16,17 21,12 16,7" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgLock(col,size){size=size||20;col=col||'#fff';return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="12" rx="2" fill="'+col+'" fill-opacity=".15" stroke="'+col+'" stroke-width="1.8"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.5" fill="'+col+'"/></svg>';}  
function svgMail(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" stroke="'+ORANGE+'" stroke-width="1.8"/><path d="M2 8l10 7 10-7" stroke="'+ORANGE+'" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgCopy(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="'+ORANGE+'" stroke-width="1.8"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="'+ORANGE+'" stroke-width="1.8" stroke-linecap="round"/></svg>';}  
function svgTriangle(){return '<svg class="blink-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="'+ORANGE+'" stroke-width="1.6" stroke-linejoin="round" fill="#fff3ee"/><line x1="12" y1="9" x2="12" y2="13" stroke="'+ORANGE+'" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="'+ORANGE+'"/></svg>';}  
function svgNfc(){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" stroke-linecap="round"><path d="M12 2a10 10 0 010 20"/><path d="M12 6a6 6 0 010 12"/><path d="M12 10a2 2 0 010 4"/></svg>';}  
  
function showNotifications(){

var cardAnimating=false;  
  
function animateFlip(toBack,onMidpoint,onDone){  
  var scene=document.getElementById('cardScene');  
  if(!scene||cardAnimating)return;  
  cardAnimating=true;  
  var angle=0,target=90,speed=6,midDone=false;  
  function step(){  
    angle+=speed;  
    if(angle>=target){  
      angle=target;  
      if(!midDone){midDone=true;if(onMidpoint)onMidpoint();}  
      var angle2=90;  
      function step2(){  
        angle2-=speed;  
        if(angle2<=0)angle2=0;  
        var scaleX=Math.abs(Math.cos(angle2*Math.PI/180));  
        scene.style.transform='perspective(800px) rotateY('+angle2+'deg) scaleX('+Math.max(scaleX,0.01)+')';  
        if(angle2>0){requestAnimationFrame(step2);}  
        else{scene.style.transform='';cardAnimating=false;if(onDone)onDone();}  
      }  
      requestAnimationFrame(step2);  
      return;  
    }  
    var scaleX=Math.abs(Math.cos(angle*Math.PI/180));  
    scene.style.transform='perspective(800px) rotateY('+angle+'deg) scaleX('+Math.max(scaleX,0.01)+')';  
    if(angle<target)requestAnimationFrame(step);  
  }  
  requestAnimationFrame(step);  
}  
  
function handleCardClick(){  
  if(cardAnimating)return;  
  var hint=document.getElementById('cardHint');  
  if(!cardNumberVisible){  
    cardNumberVisible=true;  
    var scroll=document.querySelector('.scroll');  
    if(scroll){scroll.innerHTML=renderComptes();bindTabEvents();}  
  } else if(!cardFlipped){  
    animateFlip(true,function(){  
      var f=document.getElementById('cardFront'),b=document.getElementById('cardBack');  
      if(f&&b){f.style.display='none';b.style.display='flex';}  
      cardFlipped=true;  
      var h=document.getElementById('cardHint');  
      if(h)h.textContent='↩ Toucher pour voir le recto';  
    },null);  
  } else {  
    animateFlip(false,function(){  
      var f=document.getElementById('cardFront'),b=document.getElementById('cardBack');  
      if(f&&b){b.style.display='none';f.style.display='flex';}  
      cardFlipped=false;cardNumberVisible=false;  
      var h=document.getElementById('cardHint');  
      if(h)h.textContent='👁 Toucher pour voir le numéro';  
    },null);  
  }  
}

    '<div style="padding:6px 14px"><button id="btn-logout2" style="width:100%;background:#fff;color:'+ORANGE+';border:1.5px solid '+ORANGE+';border-radius:8px;padding:6px;font-weight:700;font-size:11px">Se déconnecter</button></div>'+  
  '</div>';  
}

function showSplashOverlay(){  
  var d=document.createElement('div');  
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease';  
  var card=document.createElement('div');  
  card.className='splash-card';  
  card.innerHTML='<div class="splash-icon-wrap">'+svgTriangle()+'</div><div class="splash-title">⚠ Compte bloqué</div><div class="splash-msg">Votre compte est actuellement bloqué. Aucune transaction n\'est possible jusqu\'à la libération des fonds.</div><button class="btn-ok" id="ok-btn">OK</button>';  
  d.appendChild(card);  
  document.body.appendChild(d);  
  document.getElementById('ok-btn').addEventListener('click',function(){  
    d.style.opacity='0';setTimeout(function(){d.remove();},500);  
  });  
}  
  
function bindTabEvents(){  
  document.querySelectorAll('.tab-btn').forEach(function(btn){  
    btn.addEventListener('click',function(){  
      currentTab=btn.dataset.tab;  
      if(currentTab!=='comptes'){cardFlipped=false;cardNumberVisible=false;}  
      render();  
    });  
  });  
  var bl=document.getElementById('btn-logout');  
  if(bl)bl.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});  
  var bl2=document.getElementById('btn-logout2');  
  if(bl2)bl2.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});  
}  
  
function renderApp(){  
  var content='';  
  if(currentTab==='accueil')content=renderAccueil();  
  else if(currentTab==='comptes')content=renderComptes();  
  else if(currentTab==='virements')content=renderVirements();  
  else if(currentTab==='historique')content=renderHistorique();  
  else if(currentTab==='investissements')content=renderInvest();  
  else if(currentTab==='plus')content=renderPlus();  
  return '<div class="app-wrap">'+renderTopBar()+'<div class="scroll">'+content+'</div>'+renderBottomBar()+'</div>';  
}  
  
function render(){  
  var root=document.getElementById('root');  
  if(currentPage==='login'){  
    root.innerHTML=renderLogin();  
    var btnEye=document.getElementById('btn-eye');  
    var inpId=document.getElementById('inp-id');  
    var inpCode=document.getElementById('inp-code');  
    var btnLogin=document.getElementById('btn-login');  
    if(btnEye)btnEye.addEventListener('click',function(){showCode=!showCode;render();});  
    function doLogin(){  
      var id=inpId?inpId.value.trim():'';  
      var code=inpCode?inpCode.value.trim():'';  
      if(!id||!code){loginErr='Veuillez remplir tous les champs.';render();return;}  
      /* ══ NOUVEAUX IDENTIFIANTS ══ */  
      if(id!=='3535442323'||code!=='124222'){loginErr='Identifiant ou code incorrect.';render();return;}  
      loginLoading=true;loginErr='';render();  
      setTimeout(function(){loginLoading=false;currentPage='app';render();setTimeout(function(){showSplashOverlay();},300);},1000);  
    }  
    if(btnLogin)btnLogin.addEventListener('click',doLogin);  
    [inpId,inpCode].forEach(function(el){if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});});  
  } else {  
    root.innerHTML=renderApp();  
    bindTabEvents();  
  }  
}  
render();  
</script>
