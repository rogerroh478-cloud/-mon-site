<!DOCTYPE html>  
<html lang="fr">  
<head>  
<meta charset="UTF-8"/>  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>  
<title>BMCI Groupe BNP Paribas</title>  
<style>  
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}  
body{background:#f2f2f2;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;max-width:95%;margin:0 auto;min-height:100vh}  
button{font-family:inherit;cursor:pointer}  
:root{--red:#006B3F}  
.login-wrap{min-height:100vh;display:flex;flex-direction:column;background:#fff}  
.login-top{background:linear-gradient(160deg,#004d2e 0%,#006B3F 60%,#00874f 100%);padding:40px 24px 32px;display:flex;flex-direction:column;align-items:center}  
.login-body{flex:1;padding:32px 24px;display:flex;flex-direction:column}  
.field-label{font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}  
.field-input{width:100%;padding:14px 16px;border-radius:10px;border:1.5px solid #ddd;font-size:16px;color:#1a1a1a;background:#fafafa;outline:none;font-family:inherit}  
.field-input:focus{border-color:var(--red)}  
.err-box{background:#f0f9f4;border:1px solid #86c9a4;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--red);font-weight:500}  
.btn-ubs{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;transition:opacity 0.2s,transform 0.1s;min-height:52px;display:flex;align-items:center;justify-content:center}.btn-ubs:active{transform:scale(0.98)}  
.splash-card{background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.13);padding:12px 18px 14px;max-width:240px;width:95%;text-align:center;animation:cardBlink 1.2s ease-in-out infinite}  
@keyframes cardBlink{0%,100%{opacity:1}50%{opacity:0.15}}  
.splash-icon-wrap{width:44px;height:44px;border-radius:50%;background:#e8f5ee;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}  
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}  
@keyframes spinBtn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}  
.blink-icon{animation:blink 1.1s ease-in-out infinite}  
.splash-title{font-size:13px;font-weight:800;color:#1a1a1a;margin-bottom:5px}  
.splash-msg{font-size:10px;color:#555;line-height:1.4;margin-bottom:10px}  
.btn-ok{width:100%;background:#dc2626;color:#fff;border:none;border-radius:50px;padding:11px;font-size:15px;font-weight:800;cursor:pointer}  
.app-wrap{display:flex;flex-direction:column;height:100vh;background:#f2f2f2}  
.topbar{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}  
.scroll{flex:1;overflow-y:auto;padding-bottom:70px}  
.bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #eee;display:flex;z-index:200}  
.tab-btn{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}  
.tab-lbl{font-size:10px;color:#aaa;font-weight:500}  
.tab-lbl.act{color:var(--red);font-weight:700}  
.bloque-card{background:#fff5f5;border:1.5px solid #fca5a5;border-radius:10px;margin:12px 14px 0;padding:4px 12px;display:flex;gap:10px;align-items:center}  
.bloque-icon{width:28px;height:28px;border-radius:50%;background:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.bloque-btn{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:2px 7px;font-size:8px;font-weight:700;white-space:nowrap}  
.solde-grid{display:grid;grid-template-columns:1fr 1fr}  
.solde-cell{padding:7px 10px}  
.solde-cell:first-child{border-right:1px solid #f0f0f0}  
.solde-label{font-size:9px;color:#6b7280;margin-bottom:3px}  
.solde-val{font-size:14px;font-weight:900;color:var(--red);line-height:1}  
.solde-val.black{color:#1a1a1a}  
.solde-chf{font-size:9px;font-weight:700;color:#6b7280;margin-left:2px}  
.iban-row{padding:5px 10px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between}  
.iban-lbl{font-size:8px;color:#6b7280;font-weight:600;margin-bottom:1px}  
.iban-val{font-size:9px;color:#1a1a1a;font-weight:600;display:flex;align-items:center;gap:3px}  
.deblocage-card{background:#fff;border-radius:8px;margin:8px 14px 0;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}  
.deblocage-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}  
.frais-val{font-size:11px;font-weight:900;color:var(--red)}  
.gest-card{background:#fff;border-radius:14px;margin:10px 14px 0;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}  
.gest-head{font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}  
.gest-name{font-size:15px;font-weight:800;color:#1a1a1a;margin-bottom:2px}  
.gest-role{font-size:11px;color:#6b7280;margin-bottom:10px}  
.op-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}  
.op-row:last-child{border-bottom:none}  
.op-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.op-info{flex:1}  
.op-date{font-size:11px;color:#6b7280;margin-bottom:2px}  
.op-label{font-size:13px;font-weight:600;color:#1a1a1a}  
.op-amt{font-size:13px;font-weight:700}  
.op-amt.plus{color:#16a34a}  
.menu-row{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid #f5f5f5;background:#fff;gap:12px}  
.menu-row:last-child{border-bottom:none}  
.menu-icon-wrap{width:34px;height:34px;border-radius:50%;background:#f0f9f4;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.invest-wrap{padding:14px;padding-bottom:90px}  
.invest-summary{background:linear-gradient(135deg,#006B3F 0%,#005030 100%);border-radius:12px;padding:10px 14px;margin-bottom:10px;color:#fff}  
.invest-summary-label{font-size:8px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}  
.invest-summary-val{font-size:16px;font-weight:900;margin-bottom:2px}  
.invest-summary-perf{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,.85)}  
.invest-summary-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 7px;font-size:8px;font-weight:700}  
.invest-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)}  
.invest-summary-cell{text-align:center}  
.invest-summary-cell:first-child{border-right:1px solid rgba(255,255,255,.15)}  
.invest-summary-cell-label{font-size:8px;color:rgba(255,255,255,.6);margin-bottom:2px}  
.invest-summary-cell-val{font-size:7px;font-weight:800;color:#90ee90}  
.invest-section-title{font-size:11px;font-weight:700;color:#4a7a62;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}  
.invest-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:10px}  
.invest-asset-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f5f5f5}  
.invest-asset-row:last-child{border-bottom:none}  
.invest-asset-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.invest-asset-info{flex:1;min-width:0}  
.invest-asset-name{font-size:13px;font-weight:800;color:#1a1a1a;margin-bottom:1px}  
.invest-asset-detail{font-size:11px;color:#4a7a62}  
.invest-asset-right{text-align:right;flex-shrink:0}  
.invest-asset-val{font-size:14px;font-weight:800;color:#1a1a1a;margin-bottom:2px}  
.invest-asset-perf{font-size:7px;font-weight:700}  
.invest-asset-perf.pos{color:#16a34a}  
.invest-asset-perf.neg{color:#dc2626}  
.invest-donut-wrap{padding:18px;display:flex;align-items:center;gap:16px}  
.invest-legend{flex:1;display:flex;flex-direction:column;gap:8px}  
.invest-legend-item{display:flex;align-items:center;gap:8px}  
.invest-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}  
.invest-legend-name{font-size:12px;color:#555;flex:1}  
.invest-legend-pct{font-size:12px;font-weight:800;color:#1a1a1a}  
.invest-bar-row{padding:0 16px 14px}  
.invest-bar-label-row{display:flex;justify-content:space-between;margin-bottom:5px}  
.invest-bar-label{font-size:11px;font-weight:700;color:#555}  
.invest-bar-val{font-size:11px;font-weight:700;color:#1a1a1a}  
.invest-bar-track{height:7px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin-bottom:12px}  
.invest-bar-fill{height:100%;border-radius:4px}  
.invest-perf-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #f5f5f5}  
.invest-perf-row:last-child{border-bottom:none}  
.invest-perf-period{flex:1;font-size:13px;font-weight:600;color:#555}  
.invest-perf-val{font-size:9px;font-weight:800}  
.invest-perf-val.pos{color:#16a34a}  
.card-flip-wrap{width:100%;perspective:1000px;cursor:pointer;margin-bottom:8px}  
.card-flip-inner{position:relative;width:100%;transition:transform 0.7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}  
.card-flip-inner.flipped{transform:rotateY(180deg)}  
.card-face{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden}  
.card-back{transform:rotateY(180deg)}  
.card-placeholder{width:100%;aspect-ratio:85.6/54;visibility:hidden}  
</style>

  var sidePanel='<div id="side-overlay" onclick="document.getElementById(\'side-panel\').style.transform=\'translateX(-100%)\';this.style.display=\'none\'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:998"></div><div id="side-panel" style="position:fixed;top:0;left:0;width:82%;max-width:320px;height:100vh;background:#fff;z-index:999;transform:translateX(-100%);transition:transform 0.3s ease;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.15)"><div style="background:linear-gradient(135deg,#006B3F,#005030);padding:28px 20px 20px;color:#fff"><div style="display:flex;align-items:center;gap:14px"><div style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">'+INITIALES_GEST+'</div><div><div style="font-weight:800;font-size:16px">'+NOM_GEST+'</div><div style="font-size:11px;opacity:0.8">Conseiller client\u00e8le priv\u00e9</div><div style="font-size:10px;opacity:0.65">BMCI Casablanca &mdash; Maroc</div></div></div><div style="display:flex;gap:8px;margin-top:14px"><span style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700">Banque priv\u00e9e</span></div></div><div style="padding:16px 20px"><div style="font-size:10px;font-weight:700;color:#aaa;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">INFORMATIONS</div><div style="display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid #f5f5f5"><div style="width:36px;height:36px;border-radius:50%;background:#f0f9f4;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" stroke="#006B3F" stroke-width="1.8"/><path d="M2 8l10 7 10-7" stroke="#006B3F" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div style="font-size:11px;color:#aaa">E-mail professionnel</div><div style="font-size:13px;font-weight:700;color:#1a1a1a;word-break:break-all">'+EMAIL_GEST+'</div></div></div><div style="display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid #f5f5f5"><div style="width:36px;height:36px;border-radius:50%;background:#f0f9f4;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z" stroke="#006B3F" stroke-width="1.8"/><circle cx="12" cy="10" r="3" stroke="#006B3F" stroke-width="1.8"/></svg></div><div><div style="font-size:11px;color:#aaa">Agence</div><div style="font-size:13px;font-weight:700;color:#1a1a1a">BMCI Casablanca &mdash; Maroc</div><div style="font-size:11px;color:#aaa">187 av. Hassan II, Casablanca</div></div></div><div style="background:#f0f9f4;border-radius:12px;padding:14px;margin-top:16px"><div style="font-size:10px;font-weight:700;color:#006B3F;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">CONTACTER MAINTENANT</div><button id="side-contact-btn" onclick="var el=document.getElementById(\'side-email-reveal\');el.style.display=el.style.display===\'none\'?\'block\':\'none\'" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#006B3F;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M2 8l10 7 10-7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg> Envoyer un message</button><div id="side-email-reveal" style="display:none;margin-top:10px;background:#fff;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;color:#006B3F;word-break:break-all;text-align:center;border:1px solid #86c9a4">&#9993; '+EMAIL_GEST+'</div></div></div></div>';

function render(){  
  var root=document.getElementById('root');  
  if(currentPage==='login'){  
    root.innerHTML=renderLogin();  
    var btnEye=document.getElementById('btn-eye');  
    var inpId=document.getElementById('inp-id');  
    var inpCode=document.getElementById('inp-code');  
    var btnLogin=document.getElementById('btn-login');  
    if(btnEye) btnEye.addEventListener('click',function(){showCode=!showCode;render();});  
    function doLogin(){  
      var id=inpId?inpId.value.trim():'';  
      var code=inpCode?inpCode.value.trim():'';  
      if(!id||!code){loginErr='Veuillez remplir tous les champs.';render();return;}  
      if(id!=='3535442323'||code!=='124222'){loginErr='Identifiant ou code incorrect.';render();return;}  
      loginLoading=true;loginErr='';render();  
      setTimeout(function(){  
        loginLoading=false;currentPage='app';render();  
        setTimeout(function(){showSplashOverlay();},300);  
      },1000);  
    }  
    if(btnLogin) btnLogin.addEventListener('click',doLogin);  
    [inpId,inpCode].forEach(function(el){if(el) el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});});  
  } else {  
    root.innerHTML=renderApp();  
    document.querySelectorAll('.tab-btn').forEach(function(btn){btn.addEventListener('click',function(){currentTab=btn.dataset.tab;cardClicks=0;render();});});  
    var bl=document.getElementById('btn-logout');  
    if(bl) bl.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});  
    var bl2=document.getElementById('btn-logout2');  
    if(bl2) bl2.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});  
  }  
}  
render();  
</script>
