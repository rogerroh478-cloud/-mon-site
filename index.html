function generateVirementPDF(data){  
  var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});  
  var W=210,margin=18,y=0;  
  
  doc.setFillColor(0,49,104);  
  doc.rect(0,0,W,38,'F');  
  doc.setTextColor(255,255,255);  
  doc.setFont('helvetica','bold');  
  doc.setFontSize(18);  
  doc.text('RBC BANQUE ROYALE',margin,16);  
  doc.setFontSize(9);  
  doc.setFont('helvetica','normal');  
  doc.text('ESPACE CLIENT EN LIGNE · Membre SADC',margin,23);  
  doc.setFontSize(13);  
  doc.setFont('helvetica','bold');  
  doc.text('CONFIRMATION DE VIREMENT',margin,33);  
  
  y=48;  
  doc.setFillColor(238,241,248);  
  doc.roundedRect(margin,y,W-margin*2,14,3,3,'F');  
  doc.setTextColor(0,32,80);  
  doc.setFontSize(9);doc.setFont('helvetica','bold');  
  doc.text('RÉFÉRENCE DE L\'OPÉRATION',margin+4,y+6);  
  doc.setTextColor(0,0,0);doc.setFontSize(11);  
  doc.text(data.reference,margin+4,y+12);  
  y+=22;  
  
  doc.setFillColor(255,248,225);  
  doc.roundedRect(margin,y,W-margin*2,10,3,3,'F');  
  doc.setTextColor(230,126,0);doc.setFontSize(9);doc.setFont('helvetica','bold');  
  var statutLabel=data.statut==='BLOQUÉ'?'🔒  STATUT : VIREMENT BLOQUÉ':'⏳  STATUT : EN ATTENTE DE TRAITEMENT';  
  var statutColor=data.statut==='BLOQUÉ'?[192,0,26]:[230,126,0];  
  doc.setTextColor(statutColor[0],statutColor[1],statutColor[2]);  
  doc.text(statutLabel,margin+4,y+7);  
  y+=18;  
  
  function drawSection(title,rows){  
    doc.setFillColor(0,49,104);  
    doc.rect(margin,y,4,rows.length*9+8,'F');  
    doc.setTextColor(0,32,80);doc.setFont('helvetica','bold');doc.setFontSize(9);  
    doc.text(title,margin+7,y+6);y+=10;  
    rows.forEach(function(r){  
      doc.setFont('helvetica','normal');doc.setTextColor(100,100,100);doc.setFontSize(8);  
      doc.text(r[0],margin+7,y);  
      doc.setFont('helvetica','bold');doc.setTextColor(0,0,0);doc.setFontSize(9);  
      doc.text(r[1],W-margin,y,{align:'right'});  
      y+=9;  
    });y+=6;  
  }  
  
  drawSection('DONNEUR D\'ORDRE',[  
    ['Titulaire',CLIENT_NOM],  
    ['N° compte','003 · 00123 · 1234-5678901'],  
    ['Institution','003 — RBC Banque Royale'],  
  ]);  
  drawSection('BÉNÉFICIAIRE',[  
    ['Nom',data.beneficiaire],  
    ['Banque',data.banque||'—'],  
    data.type==='International'?['IBAN',data.iban||'—']:['Transit · Institution',data.coordonnees||'—'],  
    data.type==='International'?['BIC / SWIFT',data.bic||'—']:['',''],  
    data.type==='International'?['Pays',data.pays||'—']:['',''],  
    ['Type de virement',data.type],  
  ].filter(function(r){return r[0]!=='';}));  
  drawSection('DÉTAILS DU VIREMENT',[  
    ['Montant',data.montant],  
    ['Motif',data.motif||'Virement'],  
    ['Date d\'émission',data.date],  
    ['Heure',data.heure],  
  ]);  
  
  var isBloque=data.statut==='BLOQUÉ';  
  doc.setFillColor(isBloque?253:253,isBloque?232:238,isBloque?232:232);  
  doc.roundedRect(margin,y,W-margin*2,18,3,3,'F');  
  doc.setTextColor(192,0,26);doc.setFont('helvetica','bold');doc.setFontSize(8);  
  doc.text(isBloque?'⚠️ VIREMENT BLOQUÉ — ACTION REQUISE':'IMPORTANT',margin+4,y+6);  
  doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);  
  if(isBloque){  
    doc.text('Ce virement a été bloqué par nos systèmes de sécurité. Les fonds ne seront pas crédités.',margin+4,y+11);  
    doc.text('Contactez immédiatement votre conseillère Douchesse Isabelle pour débloquer le virement.',margin+4,y+16);  
  }else{  
    doc.text('Ce virement est en cours de traitement. Les fonds seront crédités sous 1-3 jours ouvrables.',margin+4,y+11);  
    doc.text('Pour toute question, contactez votre conseillère Douchesse Isabelle.',margin+4,y+16);  
  }  
  y+=26;  
  
  doc.setDrawColor(0,49,104);doc.setLineWidth(0.5);doc.line(margin,y,W-margin,y);y+=5;  
  doc.setTextColor(150,150,150);doc.setFontSize(7);doc.setFont('helvetica','normal');  
  doc.text('RBC Banque Royale du Canada · N° institution 003 · Membre SADC · rbc.com',W/2,y,{align:'center'});  
  doc.text('Document généré le '+data.date+' à '+data.heure+' — Non contractuel',W/2,y+4,{align:'center'});  
  
  doc.save('Virement_RBC_'+data.reference+'.pdf');  
}  
  
function checkPendingEmails(){  
  try{  
    var keys=Object.keys(localStorage).filter(function(k){return k.indexOf('rbc_pending_')===0;});  
    keys.forEach(function(key){
