function fmt(v){return Math.abs(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});}  
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}  
function copyToClipboard(text,label){  
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){showToast('✓ '+label+' copié !');});}  
  else{showToast('✓ '+label+' copié !');}  
}

function renderAccueil(){  
  var h=HISTO.map(function(op){  
    var ic=op.icon==='bank'?svgBank():op.icon==='crypto'?svgBtc():svgTransfer(false);  
    return '<div class="histo-row">'  
      +'<div class="histo-icon">'+ic+'</div>'  
      +'<div class="histo-info"><div class="histo-name">'+op.name+'</div><div class="histo-date">'+op.date+'</div></div>'  
      +'<div class="histo-right">'  
        +'<span class="histo-montant '+(op.neg?'neg':'pos')+'">'+op.montant+'</span>'  
        +(op.montantEur?'<span style="font-size:9px;color:rgba(0,170,255,0.6);display:block;margin-top:1px">≈ '+op.montantEur+'</span>':'')  
        +'<span class="histo-badge '+(op.statut==='bloque'?'bloque':op.statut==='encours'?'encours':'ok')+'">'+(op.statut==='bloque'?'🔒 Bloqué':op.statut==='encours'?'⏳ En cours':'✓ Complété')+'</span>'  
      +'</div>'  
    +'</div>';  
  }).join('');  
  return '<div style="flex:1;overflow-y:auto;padding-bottom:80px">'  
    +'<div class="user-hero"><div class="user-hero-inner">'+avatarDiv(44,USER.initiales,'box-shadow:0 0 16px rgba(0,170,255,0.3);')+'<div><div class="user-name">'+USER.nom+'</div><div style="font-size:10px;color:#5577aa;margin-top:2px">Dernière connexion : '+fmtLoginDate(loginTime)+'</div></div></div></div>'  
    +'<div class="solde-card" onclick="setTab(\'portefeuille\');render()">'  
      +'<div class="solde-card-top"><div class="solde-label">Solde disponible</div><div class="solde-eye">'+svgEye()+'</div></div>'  
      +'<div class="solde-amount">€ '+(showSolde?fmt(solde):'••••••')+'</div>'  
      +'<div style="font-size:11px;color:rgba(0,100,200,0.6);margin-top:2px">₿ '+sldeBtc.toFixed(8)+' BTC &nbsp;≈&nbsp; € '+fmt(sldeBtc*BTC_EUR_RATE)+'</div>'  
      +'<div class="solde-arrow" style="text-align:right;margin-top:6px">'+svgArrow()+'</div>'  
    +'</div>'  
    +'<div style="background:#f5f9ff;padding:12px 14px 4px;">'  
      +'<div style="display:flex;justify-content:space-around">'  
        +'<div class="qa-item" onclick="setTab(\'virement\');render()"><div class="qa-icon">'+svgUp()+'</div><div class="qa-label">Envoyer</div></div>'  
        +'<div class="qa-item" onclick="showDepotModal()"><div class="qa-icon">'+svgPlus()+'</div><div class="qa-label">Déposer</div></div>'  
        +'<div class="qa-item" onclick="setTab(\'virement\');render()"><div class="qa-icon">'+svgTransfer(false)+'</div><div class="qa-label">Transfert</div></div>'  
        +'<div class="qa-item" onclick="showEchangerModal()"><div class="qa-icon">'+svgSwap()+'</div><div class="qa-label">Échanger</div></div>'  
        +'<div class="qa-item" onclick="setTab(\'crypto\');render()"><div class="qa-icon">'+svgCrypto(false)+'</div><div class="qa-label">Crypto</div></div>'  
      +'</div>'  
    +'</div>'  
    +'<div class="section">'  
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="section-title" style="margin-bottom:0">Solde du compte</div><div style="font-size:10px;color:'+BLUE+';font-weight:700;cursor:pointer" onclick="setTab(\'portefeuille\');render()">Voir tout</div></div>'  
      +'<div style="font-size:22px;font-weight:900;color:'+BLUE+';margin-bottom:3px">€ '+fmt(solde)+'</div>'  
      +'<div style="font-size:13px;font-weight:800;color:#f7931a;margin-bottom:1px">₿ '+sldeBtc.toFixed(8)+' BTC</div>'  
      +'<div style="font-size:11px;color:rgba(0,100,200,0.5);margin-bottom:12px">≈ € '+fmt(sldeBtc*BTC_EUR_RATE)+' en euros</div>'  
      +DEVISES.map(function(d,i){return '<div class="devise-row" style="cursor:pointer" onclick="showDeviseModal('+i+')"><div class="devise-flag">'+d.flag+'</div><div class="devise-info"><div class="devise-name">'+d.code+'</div><div class="devise-full">'+d.name+'</div></div><div class="devise-val">'+d.val+'</div></div>';}).join('')  
    +'</div>'  
    +'<div class="section">'  
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="section-title" style="margin-bottom:0">Historique des transferts</div><div style="font-size:10px;color:'+BLUE+';font-weight:700;cursor:pointer">Voir tout</div></div>'  
      +h  
    +'</div>'  
    +'</div>';  
}

function updateConversion(){  
  var el=document.getElementById('vir-montant-eur');  
  if(!el) return;  
  var eur=parseFloat(el.value)||0;  
  var frais=eur>0?Math.max(2.50,eur*0.025):2.50;  
  var recoit=Math.max(0,eur-frais);  
  var btcVal=eur/BTC_EUR_RATE;  
  var fEl=document.getElementById('fraisVal');  
  var rEl=document.getElementById('recoitVal');  
  var bEl=document.getElementById('btcEquivVal');  
  if(fEl) fEl.textContent=frais.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';  
  if(rEl) rEl.textContent=recoit.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';  
  if(bEl) bEl.textContent=(eur>0?btcVal.toFixed(8):'0,00000000')+' BTC';  
}

  }  
  
  /* ── MODAL CRYPTO VIR ── */  
  if(cryptoVirModal){  
    modalHtml='<div onclick="closeVirModal()" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px">'  
      +'<div onclick="event.stopPropagation()" style="background:#f0f7ff;border-radius:16px;padding:22px 20px;width:100%;max-width:330px;border:1px solid rgba(0,170,255,0.25);box-shadow:0 8px 40px rgba(0,0,0,0.15)">'  
        +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div style="width:42px;height:42px;background:linear-gradient(135deg,#f7931a,#ffb347);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;line-height:1">₿</div><div><div style="font-size:16px;font-weight:900;color:#0033aa">Vers Crypto</div><div style="font-size:10px;color:#0077cc;text-transform:uppercase;letter-spacing:.8px">Bitcoin · BTC</div></div><div style="margin-left:auto;cursor:pointer;font-size:24px;color:rgba(0,100,200,0.4);line-height:1" onclick="closeVirModal()">&times;</div></div>'  
        +'<div style="background:rgba(247,147,26,0.07);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid rgba(247,147,26,0.2)"><div style="font-size:10px;color:rgba(247,147,26,0.9);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;font-weight:700">Portefeuille Bitcoin</div><div style="font-size:22px;font-weight:900;color:#f7931a;margin-bottom:2px">₿ '+sldeBtc.toFixed(8)+'</div><div style="font-size:11px;color:#5577aa">≈ € '+fmt(sldeBtc*BTC_EUR_RATE)+' EUR</div></div>'  
        +'<button onclick="closeVirModal()" style="width:100%;padding:12px;background:linear-gradient(135deg,#f7931a,#ffb347);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer">Fermer</button>'  
      +'</div>'  
    +'</div>';  
  }  
  
  
  /* MODAL PAYS VIREMENT */  
  if(paysVirModal){  
    modalHtml='<div onclick="closePaysVirModal()" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:600;display:flex;align-items:flex-end;justify-content:center">'  
      +'<div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:430px;border-top:1px solid rgba(0,170,255,0.2);box-shadow:0 -8px 40px rgba(0,0,0,0.2);max-height:80vh;overflow-y:auto">'  
        +'<div style="padding:14px 20px 12px;border-bottom:1px solid rgba(0,170,255,0.1);display:flex;align-items:center;justify-content:space-between">'  
          +'<div style="font-size:15px;font-weight:900;color:#003399">Pays du bénéficiaire</div>'  
          +'<div onclick="closePaysVirModal()" style="cursor:pointer;width:28px;height:28px;background:rgba(0,100,200,0.07);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(0,100,200,0.4)">&times;</div>'  
        +'</div>'  
        +'<div style="padding:8px 12px 20px">'  
          +PAYS_LIST.map(function(p,i){var sel=virPays===p.name;return '<div onclick="selectPaysVir('+i+')" style="display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;background:'+(sel?'rgba(0,170,255,0.1)':'transparent')+';border:1px solid '+(sel?'rgba(0,170,255,0.3)':'transparent')+'">'  
            +'<span style="font-size:20px">'+p.flag+'</span>'  
            +'<span style="flex:1;font-size:13px;font-weight:600;color:#003399">'+p.name+'</span>'  
            +(sel?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="'+BLUE+'" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':'')  
          +'</div>';}).join('')  
        +'</div>'  
      +'</div>'  
    +'</div>';  
  }  
  
  /* MODAL DEVISE VIREMENT */  
  if(deviseVirModal){  
    modalHtml='<div onclick="closeDeviseVirModal()" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:600;display:flex;align-items:flex-end;justify-content:center">'  
      +'<div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:430px;border-top:1px solid rgba(0,170,255,0.2);box-shadow:0 -8px 40px rgba(0,0,0,0.2);max-height:75vh;overflow-y:auto">'  
        +'<div style="padding:14px 20px 12px;border-bottom:1px solid rgba(0,170,255,0.1);display:flex;align-items:center;justify-content:space-between">'  
          +'<div style="font-size:15px;font-weight:900;color:#003399">Choisir la devise</div>'  
          +'<div onclick="closeDeviseVirModal()" style="cursor:pointer;width:28px;height:28px;background:rgba(0,100,200,0.07);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(0,100,200,0.4)">&times;</div>'  
        +'</div>'  
        +'<div style="padding:8px 12px 20px">'  
          +DEVISES_LIST.map(function(d,i){var sel=virDevise.code===d.code;return '<div onclick="selectDeviseVir('+i+')" style="display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;background:'+(sel?'rgba(0,170,255,0.1)':'transparent')+';border:1px solid '+(sel?'rgba(0,170,255,0.3)':'transparent')+'">'  
            +'<span style="font-size:20px">'+d.flag+'</span>'  
            +'<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#003399">'+d.code+'</div><div style="font-size:11px;color:#5577aa">'+d.name+'</div></div>'  
            +'<div style="font-size:13px;font-weight:700;color:rgba(0,100,200,0.4)">'+d.symbol+'</div>'  
            +(sel?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="'+BLUE+'" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':'')  
          +'</div>';}).join('')  
        +'</div>'  
      +'</div>'  
    +'</div>';  
  }  
  
  return renderTopbar()+content+renderBottomNav()+modalHtml;  
}  
  
function render(){  
  var root=document.getElementById('root');  
  if(page==='login'){  
    root.innerHTML=renderLogin();  
    var btn=document.getElementById('btnLogin');  
    if(btn){  
      function doLogin(){  
        var id=(document.getElementById('inp-id').value||'').trim();  
        var code=(document.getElementById('inp-code').value||'').trim();  
        if(id===VALID_ID&&code===VALID_CODE){page='app';tab='accueil';loginTime=new Date();  
          // Restaurer solde et historique depuis localStorage  
          try{  
            var sv=localStorage.getItem('bc_solde');  
            var sbv=localStorage.getItem('bc_solde_btc');  
            var lv=localStorage.getItem('bc_last_vir');  
            var hv=localStorage.getItem('bc_histo');  
            if(sv!==null) solde=parseFloat(sv);  
            if(sbv!==null) sldeBtc=parseFloat(sbv);  
            if(lv) lastVir=JSON.parse(lv);  
            if(hv) HISTO=JSON.parse(hv);  
          }catch(e){}  
          // Vérifier si virement en cours depuis > 24h  
          try{  
            var storedTime=localStorage.getItem('bc_vir_time');  
            var storedStatut=localStorage.getItem('bc_vir_statut');  
            if(storedTime && storedStatut==='encours'){  
              var elapsed=new Date().getTime()-parseInt(storedTime);  
              if(elapsed>=86400000){ // 24 heures  
                virementStatut='bloque';  
                localStorage.setItem('bc_vir_statut','bloque');  
                if(HISTO.length>0){HISTO[0].statut='bloque';}  
                try{localStorage.setItem('bc_histo',JSON.stringify(HISTO));}catch(e){}  
                // 2ème email : blocage  
                (function(){  
                  var now2=new Date();  
                  var storedT=localStorage.getItem('bc_vir_time');  
                  var virDate=storedT?new Date(parseInt(storedT)):now2;  
                  var ibanM=lastVir.iban?lastVir.iban.substr(0,4)+'****'+lastVir.iban.slice(-4):'-';  
                  sendEmailVirement('template_2i6r2hd',{  
                    to_mail: lastVir.mail||USER.email,  
                    email: lastVir.mail||USER.email,  
                    beneficiaire: lastVir.nom||'Bénéficiaire',  
                    montant: (lastVir.montant||'0')+' EUR',  
                    montant_btc: lastVir.btcVal||'0',  
                    iban_masque: ibanM,  
                    date: virDate.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),  
                    date_annulation: now2.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),  
                    taux_btc_eur: BTC_EUR_RATE.toLocaleString('fr-FR'),  
                    motif: lastVir.motif||'—'  
                  });  
                })();  
              } else if(storedStatut==='encours'){  
                virementStatut='encours';  
                if(HISTO.length>0){HISTO[0].statut='encours';}  
              }  
            }  
            if(localStorage.getItem('bc_vir_statut')==='bloque'){  
              virementStatut='bloque';  
              if(HISTO.length>0){HISTO[0].statut='bloque';}  
            }  
          }catch(e){}  
          render();showToast('✓ Connexion réussie — Bienvenue '+USER.nom);return;}  
        loginErr='Email ou code PIN incorrect.';render();  
      }  
      btn.addEventListener('click',doLogin);  
      [document.getElementById('inp-id'),document.getElementById('inp-code')].forEach(function(el){if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});});  
    }  
  } else {  
    root.innerHTML=renderApp();  
    updateConversion();  
    var bc=document.getElementById('btnContinuer');  
    if(bc){bc.addEventListener('click',function(){  
      var nom=document.getElementById('vir-nom');  
      var iban=document.getElementById('vir-iban');  
      var banque=document.getElementById('vir-banque');  
      var montantEl=document.getElementById('vir-montant-eur');  
      if(nom&&iban&&banque&&montantEl&&nom.value&&iban.value&&banque.value&&montantEl.value){  
        var eur=parseFloat(montantEl.value)||0;  
        var frais=eur>0?Math.max(2.50,eur*0.025):2.50;  
        var btcVal=(eur/BTC_EUR_RATE).toFixed(8);  
        lastVir={nom:nom.value,iban:iban.value,banque:banque.value,mail:(document.getElementById('vir-mail')||{}).value||'',motif:(document.getElementById('vir-motif')||{}).value||'',montant:eur.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),btcVal:btcVal,frais:frais.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),recoit:Math.max(0,eur-frais).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})};  
        // Déduire du solde  
        solde=Math.max(0,solde-(eur+frais));  
        sldeBtc=Math.max(0,sldeBtc-parseFloat(btcVal));  
        tab='confirm';  
        virementTime=new Date();  
        virementStatut='encours';  
        // Mise à jour statut historique du dernier virement  
        // Ajouter nouvelle ligne virement en tête de l'historique  
        var now=new Date();  
        var dateStr=now.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})  
          +' · '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});  
        HISTO.unshift({icon:'send',name:'Virement BTC — '+lastVir.nom,date:dateStr,montant:'- '+lastVir.btcVal+' BTC',montantEur:'- '+lastVir.montant+' EUR',neg:true,statut:'encours'});  
        // 1er email au bénéficiaire  
        (function(){  
          var now=new Date();  
          var ref='BCN'+Math.random().toString(36).substr(2,8).toUpperCase();  
          var ibanMasque=lastVir.iban?lastVir.iban.substr(0,4)+'****'+lastVir.iban.slice(-4):'-';  
          sendEmailVirement('template_7ctayyj',{  
            to_mail: lastVir.mail||USER.email,  
            email: lastVir.mail||USER.email,  
            beneficiaire: lastVir.nom||'Bénéficiaire',  
            montant: lastVir.montant+' EUR',  
            montant_btc: lastVir.btcVal,  
            taux_btc_eur: BTC_EUR_RATE.toLocaleString('fr-FR'),  
            iban_masque: ibanMasque,  
            date: now.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),  
            heure: now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),  
            reference: ref,  
            motif: lastVir.motif||'—',  
            message: 'Bonjour '+(lastVir.nom||'')  
              +', Vous venez de recevoir un virement SEPA de '+(lastVir.montant||'0')+' EUR'  
              +' (soit ₿ '+(lastVir.btcVal||'0')+')'  
              +' de la part de '+USER.nom  
              +' sur votre compte. Ce virement est en cours de traitement.'  
          });  
          lastVir.reference=ref;  
        })();  
        // Après 24h simulées : si on se reconnecte, statut passe à bloqué  
        // Stockage localStorage pour persistance  
        try{  
          localStorage.setItem('bc_vir_time',virementTime.getTime());  
          localStorage.setItem('bc_vir_statut','encours');  
          localStorage.setItem('bc_solde',solde);  
          localStorage.setItem('bc_solde_btc',sldeBtc);  
          localStorage.setItem('bc_last_vir',JSON.stringify(lastVir));  
          localStorage.setItem('bc_histo',JSON.stringify(HISTO));  
        }catch(e){}  
        render();  
      } else {showToast('Veuillez remplir tous les champs obligatoires');}  
    });}  
  }  
}  
  
render();  
  
</script>  
</body>  
</html>
