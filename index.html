<style>  
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}  
html,body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#ffffff;min-height:100vh;font-size:16px}

:root{--blue:#0a3e7a;--dblue:#082d58;--red:#e2001a;--navy2:#f0f6ff;--dark:#1a1a1a;--gray:#6b7280;--border:#c8dff5}  
.login-page{min-height:100vh;background:linear-gradient(135deg,#e8f1ff 0%,#f0f6ff 40%,#dde9ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.login-sub{font-size:10px;color:#0066b3;margin-bottom:32px;letter-spacing:2px;text-align:center;text-transform:uppercase}  
.login-card{width:100%;max-width:340px;background:rgba(255,255,255,0.98);border-radius:16px;padding:24px 20px;box-shadow:0 8px 40px rgba(0,0,0,0.12),0 0 0 1px rgba(0,102,179,0.15)}

.btn-blue{width:100%;padding:13px;background:linear-gradient(135deg,#004d85,#0066b3);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;box-shadow:0 4px 20px rgba(0,102,179,0.3)}

.topbar{background:#ffffff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(0,77,133,0.15)}

/* ── Compte (Accueil) : rouge & blanc ── */

.cc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}

.cc-nfc{width:26px;height:26px;opacity:.9}

.cc-num{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:19px;letter-spacing:2px;font-weight:600;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap}

.cc-visa{margin-left:auto;font-size:24px;font-weight:900;font-style:italic;letter-spacing:1px}

.cc-back{display:block}  
.cc-front,.cc-back{transition:opacity 0s linear .37s}

.cc.flipped .cc-front{opacity:0}

.cc-backhint{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:14px;color:rgba(255,255,255,.72)}

.pg-wrap{background:#f5f5f7;min-height:100vh;padding:18px 14px 110px}

.mini-row{display:flex;gap:10px}  
.mini-row .pg-card{flex:1;text-align:center;padding:14px 8px}

.pl-head{background:linear-gradient(135deg,#d63b38,#a8121a);border-radius:20px;padding:20px 18px;display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:14px;box-shadow:0 8px 20px rgba(200,48,42,.25)}

<body>  
<div id="root"></div>  
<script>

function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}  
function parseMontant(t){var n=parseFloat(t.replace(/[\s\u202f\u00a0]/g,'').replace(',','.'));return isNaN(n)?0:n;}  
  
function masquerIban(iban){  
  var raw=iban.replace(/\s/g,'');  
  if(raw.length<4)return iban;  
  var prefix=raw.substring(0,4);  
  var suffix=raw.substring(raw.length-4);  
  var stars='';  
  for(var i=4;i<raw.length-4;i+=4){stars+=' ****';}  
  return prefix+stars+' '+suffix;  
}

function envoyerVirement(){

  var c=CARTES.filter(function(x){return x.id===id;})[0];  
  var st=((cardState[id]||0)+1)%3;  
  cardState[id]=st;  
  var el=document.getElementById('cc-'+id);  
  var num=document.getElementById('num-'+id);  
  var hint=document.getElementById('hint-'+id);  
  if(st===0){el.classList.remove('flipped');num.textContent=maskedNum(c);num.classList.remove('reveal');}  
  if(st===1){num.textContent=c.num;num.classList.remove('reveal');void num.offsetWidth;num.classList.add('reveal');}

  if(hint)hint.textContent=HINTS[st];  
}

function ico(n,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';}  
function eur(v){return fmt(v).replace(/[\u202f\u00a0]/g,' ')+'€';}  
  
function donut(segs,size,sw,gap){  
  var r=(size-sw)/2,c=2*Math.PI*r,cx=size/2,off=0;  
  var o='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#f6e6e7" stroke-width="'+sw+'"/>';  
  segs.forEach(function(sg){  
    var len=c*sg.pct/100,dash=Math.max(len-gap,0.5);  
    o+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+sg.color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+' '+(c-dash)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cx+')"'+(gap===0?' stroke-linecap="round"':'')+'/>';  
    off+=len;  
  });  
  return o+'</svg>';  
}  
function ringBox(segs,size,sw,gap,inner){  
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'+donut(segs,size,sw,gap)+'<div class="ring-c">'+inner+'</div></div>';  
}  
  
/* ── Comptes ── */  
function proRows(rows){  
  return rows.map(function(r){return '<div class="pro-row"><span>'+r[0]+'</span><b'+(r[2]?' class="'+r[2]+'"':'')+'>'+r[1]+'</b></div>';}).join('');  
}  
function renderComptes(){  
  return '<div class="pg-wrap">'  
    +'<div class="vir-title">Mes comptes</div>'  
    +'<div class="vir-sub">Vue d\'ensemble de votre compte</div>'  
    +'<div class="cpt-card">'  
      +'<div class="cpt-top"><span>Compte courant</span><span class="cpt-pill">ACTIF</span></div>'  
      +'<div class="cpt-amt">'+eur(BANQUE.solde)+'</div>'  
      +'<div class="cpt-sub">Solde disponible — Agence de '+BANQUE.ville+'</div>'  
    +'</div>'  
    +'<div class="pro-title">COORDONNÉES BANCAIRES</div>'  
    +proRows([['IBAN','FR76 1027 1234 5678 9012 3456 789',''],['BIC','CMCIFRPP',''],['Domiciliation','Crédit Mutuel — Paris','']])  
    +'<div class="pro-title">DÉTAILS DU COMPTE</div>'  
    +proRows([['Type de compte','Compte courant',''],['Devise','Euro (EUR)',''],['Date d\'ouverture','02/01/2016',''],['Statut','Actif','ok']])  
    +'<div class="pro-title">PLAFONDS</div>'  
    +proRows([['Paiement par carte','500 000€ / mois',''],['Retrait','10 000€ / semaine',''],['Virement SEPA','1 000 000€ / jour','']])  
    +'<div class="pro-title">SERVICES ASSOCIÉS</div>'  
    +proRows([['Carte Visa Business','Active','ok'],['Relevés électroniques','Activés','ok'],['Virements SEPA','Activés','ok'],['Alertes de compte','Activées','ok']])  
    +'</div>';  
}  
  
/* ── Relevés ── */  
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];  
var PALETTE=['#7d0d14','#a8121a','#c8302a','#e2523f','#ef8a7a','#f4b4aa'];  
function renderReleves(){  
  var total=HISTO.reduce(function(a,o){return a+o.montant;},0);  
  var segs=HISTO.map(function(o,k){return {pct:o.montant/total*100,color:PALETTE[k%PALETTE.length]};});  
  var rows=HISTO.map(function(o,k){  
    var d=o.date.split('/');  
    var pct=o.montant/total*100;  
    return '<div class="rl-row">'  
      +'<div class="rl-ring">'+ringBox([{pct:pct,color:PALETTE[k%PALETTE.length]}],44,6,0,'<b>'+Math.round(pct)+'%</b>')+'</div>'  
      +'<div class="rl-info"><b>Relevé de '+MOIS[parseInt(d[1],10)-1]+' '+d[2]+'</b><span>Entrées + '+eur(o.montant)+'</span></div>'  
      +'<div class="rl-dl">'+ico('down')+'</div>'  
    +'</div>';  
  }).reverse().join('');  
  return '<div class="pg-wrap">'  
    +'<div class="back-btn" onclick="setTab(\'accueil\');render()">'+ico('back','')+'Accueil</div>'  
    +'<div class="vir-title">Relevés</div>'  
    +'<div class="vir-sub">Vos relevés de compte mensuels</div>'  
    +'<div class="pg-card"><div class="ac-center" style="margin:4px 0 0">'+ringBox(segs,180,18,3,'<small>Entrées 2016</small><b>'+eur(total)+'</b>')+'</div></div>'  
    +rows  
    +'</div>';  
}  
  
/* ── Plus ── */  
function renderPlus(){  
  var kv=[['mail','Email','contact@creditmutuel.fr'],['phone','Téléphone','+33 1 •• •• •• ••'],['pin','Ville',BANQUE.ville],['id','Numéro client','3535442323']];  
  var menu=[['doc','Mes relevés',"setTab('releves');render()"],['shield','Sécurité et confidentialité',''],['bell','Notifications',"setTab('alertes');render()"],['gear','Paramètres',''],['help','Aide et contact','']];  
  return '<div class="pg-wrap">'

    +'<div class="vir-sub">Votre espace client</div>'

    +'<div style="height:6px"></div>'  
    +menu.map(function(r){return '<div class="menu-row"'+(r[2]?' onclick="'+r[2]+'" style="cursor:pointer"':'')+'><div class="menu-ic">'+ico(r[0])+'</div><span>'+r[1]+'</span>'+ico('chev','chev')+'</div>';}).join('')  
    +'<button class="pl-out" onclick="page=\'login\';tab=\'accueil\';render()">Se déconnecter</button>'  
    +'</div>';  
}  
  
/* ── Alertes ── */  
var ALERTES=[  
  {ic:'shield',t:'Nouvelle connexion',d:'Connexion à votre espace depuis '+BANQUE.ville,when:'Aujourd\'hui',unread:true},  
  {ic:'arrin',t:'Virement reçu',d:'+ 79 000,00€ sur votre compte courant',when:'20/12/2016',unread:true},  
  {ic:'card',t:'Carte Visa Business',d:'Plafond de paiement mis à jour',when:'15/12/2016',unread:false},  
  {ic:'doc',t:'Relevé disponible',d:'Votre relevé de novembre est disponible',when:'01/12/2016',unread:false},  
  {ic:'arrin',t:'Virement reçu',d:'+ 63 000,00€ sur votre compte courant',when:'02/11/2016',unread:false}  
];  
function renderAlertes(){  
  return '<div class="pg-wrap">'  
    +'<div class="vir-title">Alertes</div>'  
    +'<div class="vir-sub">Vos dernières notifications</div>'  
    +ALERTES.map(function(a){  
      return '<div class="al-row"><div class="menu-ic">'+ico(a.ic)+'</div>'  
        +'<div class="al-info"><b>'+a.t+'</b><span>'+a.d+'</span><span>'+a.when+'</span></div>'  
        +(a.unread?'<div class="al-dot"></div>':'')+'</div>';  
    }).join('')  
    +'</div>';  
}  
  
function setTab(t){tab=t;}  
  
function renderApp(){  
  var content='';  
  if(tab==='accueil') content=renderAccueil();  
  else if(tab==='comptes') content=renderComptes();  
  else if(tab==='releves') content=renderReleves();  
  else if(tab==='alertes') content=renderAlertes();  
  else if(tab==='virement') content=renderVirement();  
  else if(tab==='cartes') content=renderCartes();  
  else if(tab==='plus') content=renderPlus();  
  return '<div class="app-wrap">'+renderTopbar()+content+renderBottomNav()+'</div>';  
}  
  
function render(){  
  var root=document.getElementById('root');  
  if(page==='login'){  
    root.innerHTML=renderLogin();  
    var btn=document.getElementById('btnLogin');  
    if(btn){  
      function doLogin(){  
        var id=(document.getElementById('inp-id').value||'').trim();  
        var code=(document.getElementById('inp-code').value||'').trim();  
        if(id===VALID_ID&&code===VALID_CODE){page='app';tab='accueil';render();return;}  
        loginErr='Identifiant ou code incorrect.';render();  
      }  
      btn.addEventListener('click',doLogin);  
      [document.getElementById('inp-id'),document.getElementById('inp-code')].forEach(function(el){if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});});  
    }  
  } else {  
    root.innerHTML=renderApp();  
  }  
}  
render();  
</script>
