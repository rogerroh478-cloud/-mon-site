<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>

// EmailJS config
var EMAILJS_PUBLIC='VWn4xBjiSc87lQEgp';
var EMAILJS_SERVICE='service_r1sedbq';
var EMAILJS_TPL1='template_um584p7';
var EMAILJS_TPL2='template_2wht25k';
emailjs.init({publicKey: EMAILJS_PUBLIC});

// Pending virements stored in localStorage
function getPending(){try{return JSON.parse(localStorage.getItem('pending_virements')||'[]');}catch(e){return[];}}
function savePending(arr){try{localStorage.setItem('pending_virements',JSON.stringify(arr));}catch(e){}}

// Persistence DOCS_LIST, ALL_OPS, SOLDE
function saveDocs(){try{localStorage.setItem('bnp_docs',JSON.stringify(DOCS_LIST));}catch(e){}}
function loadDocs(){try{var d=localStorage.getItem('bnp_docs');if(d)DOCS_LIST=JSON.parse(d);}catch(e){}}
function saveOps(){try{localStorage.setItem('bnp_ops',JSON.stringify(ALL_OPS));}catch(e){}}
function loadOps(){try{var d=localStorage.getItem('bnp_ops');if(d){var ops=JSON.parse(d);if(ops&&ops.length>0)ALL_OPS=ops;}}catch(e){}}
function saveSolde(){try{localStorage.setItem('bnp_solde',String(SOLDE));}catch(e){}}
function loadSolde(){try{var s=localStorage.getItem('bnp_solde');if(s!==null)SOLDE=parseFloat(s);}catch(e){}}

// Check if any pending virement is now >24h old => send template2 and mark bloque
function checkPendingStatus(){
  var now=Date.now();
  var arr=getPending();
  var changed=false;
  arr.forEach(function(v){
    if(v.status==='en_attente' && (now-v.timestamp)>86400000){
      v.status='bloque';
      // Mettre à jour DOCS_LIST
      DOCS_LIST.forEach(function(d){if(d.ref===v.reference) d.status='bloque';});
      changed=true;
      // Send template2 (blocage) with correct variables
      var nowB=new Date();
      var ddB=String(nowB.getDate()).padStart(2,'0');
      var mmB=String(nowB.getMonth()+1).padStart(2,'0');
      var yyyyB=nowB.getFullYear();
      var hhB=String(nowB.getHours()).padStart(2,'0');
      var minB=String(nowB.getMinutes()).padStart(2,'0');
      emailjs.send(EMAILJS_SERVICE,EMAILJS_TPL2,{
        to_mail: v.email_beneficiaire,
        beneficiaire: v.beneficiaire,
        montant: v.montant,
        iban_masque: v.iban_masque,
        date: v.date,
        heure: v.heure,
        date_annulation: ddB+'/'+mmB+'/'+yyyyB,
        heure_annulation: hhB+'h'+minB,
        reference: v.reference,
        expediteur: v.expediteur,
        motif: v.motif||'—'
      }).catch(function(){});
    }
  });
  if(changed){savePending(arr); saveDocs(); saveOps();}
  return arr;
}

function doVirement(){
  var ben=document.getElementById('vir-beneficiaire');
  var iban=document.getElementById('vir-iban');
  var bic=document.getElementById('vir-bic');
  var montant=document.getElementById('vir-montant');
  var email=document.getElementById('vir-email');
  var motifEl=document.getElementById('vir-motif');
  var banqueEl=document.getElementById('vir-banque');
  if(!ben||!iban||!montant||!email){return;}
  var benVal=ben.value.trim();
  var ibanVal=iban.value.trim();
  var bicVal=bic?bic.value.trim():'';
  var montantVal=parseFloat(montant.value.replace(',','.').replace(/ /g,''));
  var emailVal=email.value.trim();
  var motifVal=motifEl?motifEl.value.trim():'';
  var banqueVal=banqueEl?banqueEl.value.trim():'';
  if(!benVal||!ibanVal||!emailVal||isNaN(montantVal)||montantVal<=0){
    alert('Veuillez remplir tous les champs correctement.');return;
  }
  if(montantVal>SOLDE){
    alert('Solde insuffisant.');return;
  }
  // Deduct from balance
  SOLDE=SOLDE-montantVal;

  // Build date + heure
  var now=new Date();
  var dd=String(now.getDate()).padStart(2,'0');
  var mm=String(now.getMonth()+1).padStart(2,'0');
  var yyyy=now.getFullYear();
  var hh=String(now.getHours()).padStart(2,'0');
  var min=String(now.getMinutes()).padStart(2,'0');
  var dateStr=dd+'/'+mm+'/'+yyyy;
  var heureStr=hh+'h'+min;

  // Masque IBAN (garder 4 premiers + 4 derniers)
  var ibanMasque=ibanVal.substring(0,4)+'****'+ibanVal.substring(ibanVal.length-4);

  // Reference unique
  var ref='VIR-'+yyyy+mm+dd+'-'+Math.floor(Math.random()*9000+1000);

  // Add to ALL_OPS as "En attente"
  var ic_attente='<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11" fill="#fef9ec"/><circle cx="11" cy="11" r="4" stroke="#d97706" stroke-width="1.8" fill="none"/><path d="M11 8.5v2.5l1.5 1" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/></svg>';
  ALL_OPS.unshift({date:dateStr,label:'Virement émis',detail:'En attente',amt:montantVal,plus:false,bg:'#fef9ec',ic:ic_attente,devise:'EUR',status:'en_attente',ref:ref,email_ben:emailVal,beneficiaire:benVal,iban_masque:ibanMasque,iban:ibanVal,heure:heureStr,motif:motifVal,nomBanque:banqueVal,bic:bicVal});
  // Sauvegarder le document dans la liste
  DOCS_LIST.unshift({type:'virement',ref:ref,beneficiaire:benVal,iban:ibanVal,iban_masque:ibanMasque,amt:montantVal,date:dateStr,heure:heureStr,status:'en_attente',motif:motifVal,nomBanque:banqueVal,bic:bicVal});
  saveDocs();
  saveOps();
  saveSolde();

  // Save to pending
  var pending=getPending();
  pending.push({
    beneficiaire:benVal,
    iban_masque:ibanMasque,
    montant:fmt(montantVal)+' EUR',
    email_beneficiaire:emailVal,
    date:dateStr,
    heure:heureStr,
    reference:ref,
    expediteur:NOM,
    motif:motifVal||'—',
    timestamp:Date.now(),
    status:'en_attente'
  });
  savePending(pending);

  // Send template1 — notification immediate au beneficiaire
  emailjs.send(EMAILJS_SERVICE,EMAILJS_TPL1,{
    to_mail: emailVal,
    beneficiaire: benVal,
    montant: fmt(montantVal)+' EUR',
    iban_masque: ibanMasque,
    date: dateStr,
    heure: heureStr,
    expediteur: NOM,
    reference: ref,
    motif: motifVal||'—'
  }).then(function(r){
    console.log('T1 sent OK',r);
  }).catch(function(e){
    console.error('T1 error',JSON.stringify(e));
  });

  // Vider les champs du formulaire
  ben.value=''; iban.value=''; bic.value=''; montant.value=''; email.value=''; if(motifEl)motifEl.value=''; if(banqueEl)banqueEl.value='';

  // Show confirmation screen
  currentPage='virement_ok';
  window._virConfirm={montant:fmt(montantVal),ref:ref,beneficiaire:benVal,iban:ibanVal,motif:motifVal,nomBanque:banqueVal,bic:bicVal};
  render();
}

function ouvrirDoc(i){
  var doc=DOCS_LIST[i];
  if(!doc) return;
  // Trouver l operation correspondante
  var op=null;
  ALL_OPS.forEach(function(o){if(o.ref===doc.ref) op=o;});
  if(!op) op={beneficiaire:doc.beneficiaire,iban:doc.iban,iban_masque:doc.iban_masque,amt:doc.amt,status:doc.status,ref:doc.ref,label:'Virement'};
  var idx=ALL_OPS.indexOf(op);
  if(idx===-1){
    // Creer op temporaire
    window._recuTempOp=op;
    voirRecuOpObj(op);
  } else {
    voirRecuOp(idx);
  }
}

function render(){
  var root=document.getElementById('root');
  if(currentPage==='virement_ok'){root.innerHTML=renderVirementOK();return;}
  if(currentPage==='recu_view'){root.innerHTML=renderRecuView();return;}
  if(currentPage==='login'){
    root.innerHTML=renderLogin();
    var btnEye=document.getElementById('btn-eye');
    var inpId=document.getElementById('inp-id');
    var inpCode=document.getElementById('inp-code');
    var btnLogin=document.getElementById('btn-login');
    if(btnEye) btnEye.addEventListener('click',function(){showCode=!showCode;render();});
    function doLogin(){
      var id=inpId?inpId.value.trim():'';
      var code=inpCode?inpCode.value.trim():'';
      if(!id||!code){loginErr='Veuillez remplir tous les champs.';render();return;}
      if(id!=='3535442323'||code!=='124222'){loginErr='Identifiant ou code incorrect.';render();return;}
      // Afficher spinner directement dans le bouton sans re-render
      var btn=document.getElementById('btn-login');
      if(btn){
        btn.disabled=true;
        btn.innerHTML='<div class="login-spinner"></div><span>Connexion en cours...</span>';
        btn.style.opacity='0.9';
      }
      setTimeout(function(){
        loginLoading=false;currentPage='app';render();
        
      },2500);
    }
    if(btnLogin) btnLogin.addEventListener('click',doLogin);
    [inpId,inpCode].forEach(function(el){if(el) el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});});
  } else {
    root.innerHTML=renderApp();
    document.querySelectorAll('.tab-btn').forEach(function(btn){btn.addEventListener('click',function(){currentTab=btn.dataset.tab;cardClicks=0;render();});});
    var bl=document.getElementById('btn-logout');
    if(bl) bl.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});
    var bl2=document.getElementById('btn-logout2');
    if(bl2) bl2.addEventListener('click',function(){currentPage='login';loginErr='';currentTab='accueil';render();});
  }
}
